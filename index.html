<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px; z-index: 2; border-radius: 10px; opacity: 0.7; transform: scaleX(-1); border: 2px solid #00ffcc; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; z-index: 10; font-size: 24px; pointer-events: none; }
        #instructions { position: absolute; top: 20px; left: 20px; color: white; z-index: 2; pointer-events: none; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; }
        .hidden { display: none; }
    </style>
    <!-- Import Maps for clean module loading -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm"
            }
        }
    </script>
</head>
<body>

    <div id="loading">Initialize AI & 3D Engine...</div>
    
    <div id="instructions">
        <h3>Gesture Controls</h3>
        <p>🖐 <b>Move Hand:</b> Rotate System</p>
        <p>🤏 <b>Pinch (Index+Thumb):</b> Collapse/Expand Particles</p>
        <p>✊ <b>Make a Fist:</b> Cycle Shape (Heart, Saturn, Flower, etc)</p>
        <p>↔️ <b>Hand X Position:</b> Changes Color dynamically</p>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 15000;
        const PARTICLE_SIZE = 0.08;
        const SHAPES = ['sphere', 'heart', 'saturn', 'flower', 'torus'];
        let currentShapeIndex = 0;
        
        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Add subtle fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- PARTICLE SYSTEM ---
        const geometry = new THREE.BufferGeometry();
        const initialPositions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);

        // Initialize points randomly
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            initialPositions[i] = (Math.random() - 0.5) * 20;
            currentPositions[i] = initialPositions[i];
            colors[i] = 1.0; // White initially
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- SHAPE GENERATORS ---
        function getPointOnSphere() {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = 6;
            return {
                x: r * Math.sin(phi) * Math.cos(theta),
                y: r * Math.sin(phi) * Math.sin(theta),
                z: r * Math.cos(phi)
            };
        }

        function getPointOnHeart() {
            // Parametric Heart Equation
            let t = Math.random() * Math.PI * 2;
            let u = Math.random(); 
            // Spread points inside
            let r = 0.5 + 0.5 * Math.sqrt(u); 
            
            // Basic 2D heart extruded or 3D specific formula
            // Using a complex 3D heart approximation
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = (Math.random() - 0.5) * 4; // Thickness
            
            const scale = 0.35;
            return { x: x * scale * r, y: y * scale * r, z: z * r };
        }

        function getPointOnSaturn() {
            const r = Math.random();
            // 70% particles make the planet, 30% make the ring
            if (r > 0.3) {
                // Planet (Sphere)
                const s = getPointOnSphere();
                return { x: s.x * 0.6, y: s.y * 0.6, z: s.z * 0.6 };
            } else {
                // Ring (Disc with hole)
                const angle = Math.random() * Math.PI * 2;
                const dist = 5 + Math.random() * 3;
                return {
                    x: Math.cos(angle) * dist,
                    y: (Math.random()-0.5) * 0.2, // Flat
                    z: Math.sin(angle) * dist
                };
            }
        }

        function getPointOnFlower() {
            // Polar Rose / Flower
            const u = Math.random() * Math.PI * 2; // Angle
            const v = Math.random() * Math.PI; // Elevation
            const k = 4; // Number of petals
            const r = 5 * Math.cos(k * u) + 2; 
            
            return {
                x: r * Math.sin(v) * Math.cos(u),
                y: r * Math.sin(v) * Math.sin(u),
                z: r * Math.cos(v) * 0.5
            };
        }

        function getPointOnTorus() {
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI * 2;
            const R = 5; // Major radius
            const r = 1.5; // Minor radius
            return {
                x: (R + r * Math.cos(v)) * Math.cos(u),
                y: (R + r * Math.cos(v)) * Math.sin(u),
                z: r * Math.sin(v)
            };
        }

        function generateTargetShape(shapeName) {
            console.log("Morphing to:", shapeName);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p;
                switch(shapeName) {
                    case 'heart': p = getPointOnHeart(); break;
                    case 'saturn': p = getPointOnSaturn(); break;
                    case 'flower': p = getPointOnFlower(); break;
                    case 'torus': p = getPointOnTorus(); break;
                    default: p = getPointOnSphere(); break;
                }
                
                const idx = i * 3;
                targetPositions[idx] = p.x;
                targetPositions[idx + 1] = p.y;
                targetPositions[idx + 2] = p.z;
            }
        }

        // Generate initial shape
        generateTargetShape(SHAPES[0]);

            // --- HAND TRACKING LOGIC ---
        let handLandmarker = undefined;
        let isHandDetected = false;
        let handX = 0.5; // Normalized 0-1
        let handY = 0.5;
        let pinchDistance = 1.0;
        let isFist = false;
        let lastFistState = false; // For toggle logic

        async function setupMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
            );
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });

            // Start Webcam
            const video = document.getElementById('webcam');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
                document.getElementById('loading').classList.add('hidden');
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            const video = document.getElementById('webcam');
            
            if (handLandmarker && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const startTimeMs = performance.now();
                const results = handLandmarker.detectForVideo(video, startTimeMs);

                if (results.landmarks.length > 0) {
                    isHandDetected = true;
                    const landmarks = results.landmarks[0];

                    // 1. Get Hand Position (Index finger tip)
                    // Normalize -1 to 1 range
                    handX = (landmarks[8].x - 0.5) * -2; // Invert X because webcam is mirrored
                    handY = (landmarks[8].y - 0.5) * -2;

                    // 2. Calculate Pinch (Thumb tip vs Index tip)
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    const dx = thumbTip.x - indexTip.x;
                    const dy = thumbTip.y - indexTip.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    
                    // Map distance: Close (0.05) -> 0 scale, Open (0.2) -> 1.5 scale
                    pinchDistance = THREE.MathUtils.mapLinear(distance, 0.02, 0.2, 0.1, 2.0);
                    pinchDistance = THREE.MathUtils.clamp(pinchDistance, 0.1, 3.0);

                    // 3. Detect Fist (Check if fingers are folded down)
                    // Simple check: Tip of fingers below their PIP joints (for upright hand)
                    // Better check: Distance of tips to wrist
                    const wrist = landmarks[0];
                    const fingerTips = [8, 12, 16, 20]; // Index, Middle, Ring, Pinky
                    let foldedCount = 0;
                    
                    fingerTips.forEach(idx => {
                        const tip = landmarks[idx];
                        const base = landmarks[idx-3]; // MCP joint
                        const dTip = Math.sqrt((tip.x-wrist.x)**2 + (tip.y-wrist.y)**2);
                        const dBase = Math.sqrt((base.x-wrist.x)**2 + (base.y-wrist.y)**2);
                        if(dTip < dBase) foldedCount++;
                    });

                    isFist = foldedCount >= 3;

                    // Trigger Shape Switch on Fist creation (Rising edge)
                    if (isFist && !lastFistState) {
                        currentShapeIndex = (currentShapeIndex + 1) % SHAPES.length;
                        generateTargetShape(SHAPES[currentShapeIndex]);
                    }
                    lastFistState = isFist;

                } else {
                    isHandDetected = false;
                    // Reset gradual
                    pinchDistance = THREE.MathUtils.lerp(pinchDistance, 1.0, 0.05);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const positions = particleSystem.geometry.attributes.position.array;
            const colorsAttr = particleSystem.geometry.attributes.color.array;

            // --- INTERACTION LOGIC ---
            
            // 1. Rotation based on Hand Position or Auto Rotate
            if (isHandDetected) {
                particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, handY, 0.1);
                particleSystem.rotation.y = THREE.MathUtils.lerp(particleSystem.rotation.y, handX, 0.1);
            } else {
                particleSystem.rotation.y += 0.002;
            }

            // 2. Color calculation based on X position + Time
            const hueBase = isHandDetected ? (handX + 1) / 2 : (Math.sin(time * 0.1) + 1) / 2;
            const color = new THREE.Color();

            // 3. Update Particles
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const px = i * 3;
                const py = i * 3 + 1;
                const pz = i * 3 + 2;

                // Move towards target shape (Morphing)
                // We add some noise based on index to make the transition organic
                const lerpSpeed = 0.03 + (Math.sin(i) * 0.01); 
                
                positions[px] += (targetPositions[px] - positions[px]) * lerpSpeed;
                positions[py] += (targetPositions[py] - positions[py]) * lerpSpeed;
                positions[pz] += (targetPositions[pz] - positions[pz]) * lerpSpeed;

                // Apply Expansion (Pinch) from center
                // We don't modify the buffer directly for scale, we calculate a render position
                // But since we are using Points, we modify the actual positions relative to center for the visual effect
                // Note: To keep morphing working, we apply expansion logic mathematically on the target vs current relationship
                // A simpler visual trick: Scale the whole object
                
                // Color Dynamic Update
                // Vary color slightly per particle
                color.setHSL((hueBase + (positions[py] * 0.05)) % 1, 0.8, 0.6);
                colorsAttr[px] = color.r;
                colorsAttr[py+1] = color.g;
                colorsAttr[pz+2] = color.b;
            }

            // Apply Scale (Pinch)
            const targetScale = isHandDetected ? pinchDistance : 1.0;
            particleSystem.scale.setScalar(THREE.MathUtils.lerp(particleSystem.scale.x, targetScale, 0.1));

            // Notify Three.js that data changed
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        setupMediaPipe();
        animate();
    </script>
</body>
</html>
